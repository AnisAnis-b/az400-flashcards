  // ===== GitHub ↔ Azure DevOps =====
  // --- Pipelines ---
  {d:"eqv", q:"Quel est l'équivalent Azure Pipelines d'un workflow GitHub Actions, et où vit chaque fichier ?", a:"Le <b>pipeline</b>. GitHub : <code>.github/workflows/*.yml</code>. Azure : <code>azure-pipelines.yml</code>. Azure ajoute un niveau <b>stage</b> entre pipeline et job, qui n'existe pas nativement dans GitHub Actions."},
  {d:"eqv", q:"Quel est l'équivalent Azure Pipelines d'une action GitHub, et comment les distinguer dans un extrait YAML ?", a:"La <b>task</b>. Azure : <code>task: NodeTool@0</code>, format <code>NomTask@version</code> sans slash. GitHub : <code>uses: actions/setup-node@v3</code>, un nom avec slash. Les noms ne se traduisent pas d'une plateforme à l'autre."},
  {d:"eqv", q:"Quel est l'équivalent Azure Pipelines d'un runner GitHub, et du mot-clé <code>runs-on</code> ?", a:"L'<b>agent</b>. <code>runs-on: ubuntu-latest</code> devient <code>pool:</code> avec <code>vmImage: 'ubuntu-latest'</code>. Même modèle réseau en self-hosted des deux côtés : connexion HTTPS 443 sortante, aucun port entrant."},
  {d:"eqv", q:"Quel est l'équivalent GitHub Actions des agent demands d'Azure Pipelines ?", a:"Les <b>labels</b> : <code>runs-on: [self-hosted, linux, x64, gpu]</code> cible un self-hosted runner par ses labels, comme les demands filtrent les agents d'un pool par leurs capabilities."},
  {d:"eqv", q:"Quel mot-clé Azure Pipelines correspond au <code>needs:</code> de GitHub Actions ?", a:"<code>dependsOn:</code>. Exemple : <code>dependsOn: Build</code> sur le stage Deploy le fait attendre la réussite de Build, comme <code>needs: build</code> fait attendre un job GitHub."},
  {d:"eqv", q:"Quel est l'équivalent GitHub Actions des templates d'Azure Pipelines ?", a:"Les <b>reusable workflows</b>. Tous deux partagent du YAML <b>entre</b> pipelines, alors que <code>strategy: matrix</code> répète un job <b>dans</b> un même pipeline avec des paramètres différents."},
  // --- Dépôts, intégrations et permissions ---
  {d:"eqv", q:"Quel est l'équivalent GitHub des branch policies d'Azure Repos ?", a:"Les <b>branch protection rules</b>. Même rôle, vocabulaire différent : dans un énoncé sur Azure Repos, la bonne réponse parle de branch policies, et « branch protection rules » y est un distracteur."},
  {d:"eqv", q:"Quel est l'équivalent GitHub des service hooks d'Azure DevOps ?", a:"Les <b>webhooks</b>. Un service hook notifie un service externe quand un événement survient (ex. poster dans Slack si un build échoue). À ne pas confondre avec un Git hook, script local qui bloque ou modifie une opération Git."},
  {d:"eqv", q:"Modèle de permissions : que manipule-t-on sur GitHub, et que manipule-t-on sur Azure DevOps ?", a:"<b>GitHub</b> → des <b>rôles</b> (propriétaire, membre, collaborateur externe). <b>Azure DevOps</b> → des <b>groupes de sécurité</b> (Contributors, Readers, Project Administrators). Premier réflexe devant un énoncé : repérer de quelle plateforme il parle."},

  // ===== Syntaxe et commandes =====
  // --- Git ---
  {d:"cmd", q:"Que fait <code>git config core.hooksPath .githooks</code> ?", a:"Git utilise les hooks du dossier <code>.githooks/</code>, <b>versionné dans le dépôt</b> : c'est le moyen de partager des hooks, à lancer une fois par développeur après le clone. Alternative : Husky, outil npm, automatique à l'installation des dépendances."},
  {d:"cmd", q:"Ta pull request a été acceptée. Quelles commandes resynchronisent ton fork avec le dépôt d'origine ?", a:"<code>git fetch upstream main</code>, <code>git rebase upstream/main</code>, puis <code>git push origin</code>. <code>upstream</code> est le dépôt d'origine (on y récupère, on n'y pousse jamais), <code>origin</code> est ton fork."},
  // --- YAML des pipelines ---
  {d:"cmd", q:"Traduire en Azure Pipelines les mots-clés GitHub Actions <code>on</code>, <code>uses</code>, <code>with</code>, <code>run</code> et <code>name</code> ?", a:"<code>on</code> → <code>trigger</code> · <code>uses</code> → <code>task</code> · <code>with</code> → <code>inputs</code> · <code>run</code> → <code>script</code> · <code>name</code> → <code>displayName</code>."},
  {d:"cmd", q:"GitHub Actions : quand s'exécute un workflow planifié avec <code>cron: '0 8 * * 1-5'</code> ?", a:"À <b>8 h UTC</b> (temps universel coordonné), du lundi au vendredi. Ordre des 5 champs : minute, heure, jour, mois, jour de la semaine (dimanche = 0)."},
  {d:"cmd", q:"Que fait <code>- task: DownloadSecureFile@1</code> avec <code>inputs: secureFile: 'ca.pem'</code> ?", a:"La tâche télécharge sur l'agent le secure file <code>ca.pem</code> stocké dans la Library. Si elle porte <code>name: caCertificate</code>, le chemin du fichier se lit ensuite avec <code>$(caCertificate.secureFilePath)</code>."},
  // --- Dockerfile ---
  {d:"cmd", q:"Dockerfile multi-étapes : que fait <code>COPY --from=publish /app/publish .</code> ?", a:"Elle copie des fichiers <b>entre étapes</b> : le résultat de l'étape nommée <code>publish</code> arrive dans l'image finale. Une étape se nomme avec <code>FROM image AS nom</code> et peut hériter d'une autre (<code>FROM build AS publish</code>)."},
  {d:"cmd", q:"Dockerfile : que fait l'instruction <code>ADD</code> que <code>COPY</code> ne fait pas ?", a:"<code>ADD</code> copie des fichiers, mais accepte aussi une <b>URL</b> et <b>extrait automatiquement les archives</b>."},
  // --- KQL, DSC et Bicep ---
  {d:"cmd", q:"KQL (Kusto Query Language) : que fait <code>summarize max(CounterValue) by Computer, bin(TimeGenerated, 1m)</code> ?", a:"Elle calcule le maximum du compteur <b>par machine</b> et <b>par tranche d'une minute</b>. <code>summarize</code> agrège avec regroupement (l'équivalent d'un GROUP BY) et <code>bin()</code> arrondit les horodatages en tranches. Ajouter <code>| render timechart</code> pour obtenir un graphique temporel."},
  {d:"cmd", q:"Dans un fichier de configuration DSC (Desired State Configuration), quels sont les 3 blocs imbriqués ?", a:"<code>configuration LabConfig { }</code> : bloc externe, porte le nom. <code>Node WebServer { }</code> : qui on configure, il peut y en avoir plusieurs. Bloc resource, comme <code>WindowsFeature IIS { Ensure = 'Present' }</code> : les propriétés, ici l'élément doit être présent."},
  {d:"cmd", q:"Bicep : quels décorateurs remplacent <code>securestring</code> et <code>allowedValues</code> des templates ARM (Azure Resource Manager) ?", a:"<code>@secure()</code> remplace le type <code>securestring</code> : valeur sensible, non journalisée. <code>@allowed([...])</code> remplace <code>allowedValues</code> : restreint les valeurs à une liste. Le décorateur s'écrit au-dessus de la ligne <code>param</code>."},
  {d:"cmd", q:"Bicep : que font <code>az bicep build</code> et <code>az bicep decompile</code> ?", a:"<code>az bicep build -f ./main.bicep</code> transpile le fichier en template ARM (Azure Resource Manager) JSON, pour l'inspecter. <code>az bicep decompile</code> convertit un template ARM existant en Bicep, avec des écarts possibles : certaines fonctionnalités ne sont pas totalement supportées."},

  // ===== Astuces exam =====
  // --- Mot-clé de l'énoncé → réponse attendue ---
  {d:"tip", q:"Déclencheur : « fichiers Photoshop ou vidéos de 500 Mo »", a:"→ Git LFS (Large File Storage) : Git ne garde qu'un pointeur, le fichier binaire volumineux est stocké ailleurs et arrive à la demande."},
  {d:"tip", q:"Déclencheur : « historique linéaire strict »", a:"→ Type de merge <b>Rebase and fast-forward</b> : les commits sont rejoués linéairement, sans commit de fusion."},
  {d:"tip", q:"Déclencheur : « base de données sur le réseau interne »", a:"→ Agent <b>self-hosted</b> : un agent Microsoft-hosted n'atteint pas le réseau interne."},
  {d:"tip", q:"Déclencheur : « le code tourne en production mais personne ne le voit »", a:"→ <b>Dark launching</b>."},
  {d:"tip", q:"Déclencheur : « modifier un réglage sans redéployer ni redémarrer »", a:"→ <b>Azure App Configuration</b> : modification à chaud des réglages non sensibles et des feature flags."},
  {d:"tip", q:"Déclencheur : « le template Bicep doit créer le groupe de ressources »", a:"→ Portée (scope) <code>subscription</code> : un groupe de ressources ne peut pas se créer à l'intérieur de lui-même."},
  {d:"tip", q:"Déclencheur : « filtrer la sortie JSON d'une commande Azure CLI »", a:"→ Paramètre <code>--query</code>, dont le langage de requête s'appelle JMESPath."},
  {d:"tip", q:"Déclencheur : « le workflow doit accéder à un autre dépôt »", a:"→ <b>PAT</b> (personal access token) : la portée de <code>GITHUB_TOKEN</code> s'arrête au dépôt du workflow, d'où une erreur 403 sur un autre dépôt."},
  {d:"tip", q:"Déclencheur : « plusieurs ressources Azure partagent la même identité »", a:"→ Managed identity <b>user-assigned</b> : une seule identité, un rôle attribué une seule fois, attachée à toutes les ressources."},
  {d:"tip", q:"Déclencheur : « dans le bon groupe mais ne voit pas Test Plans »", a:"→ Niveau d'accès <b>Basic + Test Plans</b>. Basic seul ouvre Boards, Repos, Pipelines et Artifacts, pas Azure Test Plans."},
  {d:"tip", q:"Déclencheur : « vérifier la disponibilité du site depuis plusieurs pays »", a:"→ <b>Availability tests</b> (Application Insights) : tests synthétiques lancés depuis plusieurs régions."},
];
CARDS.forEach((c,i)=>c.id=i);

/* ---------- État ---------- */
let baseOrder = CARDS.map(c=>c.id);
let filter = "all";
let reviewOnly = false;
let pos = 0;
let flipped = false;
const status = {}; // id -> 'known' | 'review'

/* ---------- Persistance (localStorage, clé = texte de la question) ---------- */
const LS_KEY = "az400-progress-v1";
function saveStatus(){
  try{
    const m = {};
    for(const id in status){ m[CARDS[id].q] = status[id]; }
    localStorage.setItem(LS_KEY, JSON.stringify(m));
  }catch(e){ /* stockage indisponible : progression session uniquement */ }
}
function loadStatus(){
  try{
    const m = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    CARDS.forEach(c => { if(m[c.q]) status[c.id] = m[c.q]; });
  }catch(e){}
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const card = $("#card");

function matches(id){
  const c = CARDS[id];
  if(filter!=="all" && c.d!==filter) return false;
  if(reviewOnly && status[id]!=="review") return false;
  return true;
}
function active(){ return baseOrder.filter(matches); }

function setAccent(domKey){
  const col = DOMAINS[domKey] ? DOMAINS[domKey].color : "var(--pip)";
  document.documentElement.style.setProperty("--accent", col);
  card.style.setProperty("--accent", col);
}

/* ---------- Rendu ---------- */
function renderFilters(){
  const box = $("#filters");
  box.innerHTML = "";
  const mk = (key,label,color) => {
    const el = document.createElement("div");
    el.className = "chip" + (filter===key ? " active":"");
    el.innerHTML = (color?`<span class="dot" style="background:${color}"></span>`:"") + label;
    el.onclick = () => { filter = key; pos = 0; flipped=false; render(); };
    return el;
  };
  box.appendChild(mk("all","Tout",""));
  Object.keys(DOMAINS).forEach(k=>box.appendChild(mk(k,DOMAINS[k].short,DOMAINS[k].color)));

  const rt = document.createElement("div");
  rt.className = "chip review-toggle" + (reviewOnly?" active":"");
  const rvCount = Object.values(status).filter(s=>s==="review").length;
  rt.innerHTML = "★ À revoir" + (rvCount?` (${rvCount})`:"");
  rt.onclick = () => { reviewOnly = !reviewOnly; pos = 0; flipped=false; render(); };
  box.appendChild(rt);
}

function render(){
  renderFilters();
  const list = active();
  const total = list.length;
  const knownN = Object.values(status).filter(s=>s==="known").length;
  const reviewN = Object.values(status).filter(s=>s==="review").length;

  // stats
  $("#stats").innerHTML =
    `<span class="k">carte ${total? (pos+1):0} / ${total}</span><br>`+
    `<span class="ok">su ${knownN}</span> · <span class="rv">à revoir ${reviewN}</span>`;

  const hasCards = total>0;
  card.style.display = hasCards ? "" : "none";
  $("#nav").style.display = hasCards ? "" : "none";
  $("#actions").style.display = hasCards ? "" : "none";
  $("#empty").style.display = hasCards ? "none" : "";

  if(!hasCards){
    $("#empty").innerHTML = reviewOnly
      ? "<b>Aucune carte « à revoir ».</b><br>Marque des cartes avec « À revoir »,<br>ou désactive le filtre."
      : "<b>Aucune carte dans ce filtre.</b>";
    $("#railFill").style.width = "0%";
    return;
  }

  if(pos>=total) pos = total-1;
  if(pos<0) pos = 0;

  const id = list[pos];
  const c = CARDS[id];
  const dom = DOMAINS[c.d];
  setAccent(c.d);

  // flip state
  card.classList.toggle("flipped", flipped);
  $("#flip").textContent = flipped ? "Question" : "Retourner";

  // content
  const eyebrow = `${dom.short} <span class="num">· ${pos+1}/${total}</span>`;
  $("#feyebrow").innerHTML = eyebrow;
  $("#beyebrow").innerHTML = eyebrow;
  $("#qtext").innerHTML = c.q;
  $("#atext").innerHTML = c.a;

  // flags
  const st = status[id];
  const flagTxt = st==="known" ? "Su" : st==="review" ? "À revoir" : "";
  const flagCls = "flag" + (st?` ${st}`:"");
  ["#fflag","#bflag"].forEach(sel=>{
    const el = $(sel);
    el.textContent = flagTxt;
    el.className = flagCls;
    el.style.display = st ? "" : "none";
  });

  // rail
  $("#railFill").style.width = ((pos+1)/total*100) + "%";
}

/* ---------- Actions ---------- */
function flip(){ flipped = !flipped; render(); }
function go(delta){
  const total = active().length; if(!total) return;
  pos = (pos + delta + total) % total;
  flipped = false; render();
}
function mark(state){
  const list = active(); if(!list.length) return;
  const id = list[pos];
  status[id] = (status[id]===state) ? undefined : state;
  if(status[id]===undefined) delete status[id];
  saveStatus();
  // avancer si on vient de trancher
  if(status[id]){ setTimeout(()=>go(1), 120); } else { render(); }
}
function shuffle(){
  for(let i=baseOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [baseOrder[i],baseOrder[j]] = [baseOrder[j],baseOrder[i]];
  }
  pos = 0; flipped = false; render();
}
function reset(){
  for(const k in status) delete status[k];
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  reviewOnly = false; filter = "all"; pos = 0; flipped = false;
  baseOrder = CARDS.map(c=>c.id);
  render();
}

/* ---------- Écouteurs ---------- */
card.addEventListener("click", flip);
card.addEventListener("keydown", e=>{ if(e.key==="Enter"){e.preventDefault();flip();} });
$("#flip").addEventListener("click", e=>{ e.stopPropagation(); flip(); });
$("#prev").addEventListener("click", ()=>go(-1));
$("#next").addEventListener("click", ()=>go(1));
$("#markRev").addEventListener("click", ()=>mark("review"));
$("#markKnow").addEventListener("click", ()=>mark("known"));
$("#shuffle").addEventListener("click", shuffle);
$("#reset").addEventListener("click", reset);

document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  switch(e.key){
    case " ": e.preventDefault(); flip(); break;
    case "ArrowRight": go(1); break;
    case "ArrowLeft": go(-1); break;
    case "j": case "J": mark("known"); break;
    case "r": case "R": mark("review"); break;
    case "s": case "S": shuffle(); break;
  }
});

// swipe mobile
let tx=0, ty=0;
card.addEventListener("touchstart", e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; }, {passive:true});
card.addEventListener("touchend", e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ go(dx<0?1:-1); }
}, {passive:true});

loadStatus();
render();
$("#foot").innerHTML = CARDS.length + " cartes · pièges d'examen & astuces inclus<br>Progression sauvegardée sur cet appareil.<br><a href=\"index.html\" style=\"color:var(--muted-2)\">À propos, code source & contributions</a>";
</script>
<script>
if("serviceWorker" in navigator){ addEventListener("load", ()=>navigator.serviceWorker.register("sw.js")); }
</script>
</body>
</html>
