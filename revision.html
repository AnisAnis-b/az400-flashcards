<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AZ-400 · Cartes de révision</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="description" content="182 cartes de révision gratuites pour la certification Microsoft AZ-400 (DevOps Engineer Expert) : pièges d'examen, rappel actif, progression sauvegardée, utilisable hors ligne.">
<meta name="theme-color" content="#0e1016">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="AZ-400 · Cartes de révision">
<meta property="og:description" content="182 cartes pour réviser l'AZ-400 : pièges d'examen, 9 paquets, astuces réflexes. Gratuit, open source, hors ligne.">
<meta property="og:url" content="https://anisanis-b.github.io/az400-flashcards/revision.html">
<meta property="og:image" content="https://anisanis-b.github.io/az400-flashcards/assets/screenshot.png">
<style>
  :root{
    --bg:#0e1016;
    --bg2:#141824;
    --panel:#191d2a;
    --line:#272c3d;
    --line-2:#232838;
    --ink:#e8eaf2;
    --muted:#8b91a6;
    --muted-2:#5f6577;
    --accent:#a78bfa;
    --proc:#a78bfa;
    --src:#2dd4bf;
    --pip:#60a5fa;
    --sec:#fbbf24;
    --ins:#fb7185;
    --pie:#fb923c;
    --eqv:#e879f9;
    --cmd:#a3e635;
    --tip:#4ade80;
    --ok:#4ade80;
    --review:#fbbf24;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(167,139,250,.08), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(96,165,250,.07), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:22px 18px 60px;}

  /* ---------- Header ---------- */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand .kicker{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted-2);}
  .brand h1{
    font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:26px;margin:0;letter-spacing:-.01em;
    line-height:1.05;
  }
  .brand h1 b{color:var(--accent);font-weight:700;transition:color .3s ease;}
  .stats{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--muted);text-align:right;line-height:1.7;white-space:nowrap;}
  .stats .k{color:var(--ink);}
  .stats .ok{color:var(--ok);}
  .stats .rv{color:var(--review);}

  /* ---------- Progress ---------- */
  .rail{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:2px 0 14px;}
  .rail>span{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1),background .3s ease;}

  /* ---------- Filters ---------- */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .chip{
    font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:500;
    padding:7px 12px;border-radius:99px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    transition:all .18s ease;user-select:none;
  }
  .chip:hover{border-color:var(--muted-2);color:var(--ink);}
  .chip.active{color:#0e1016;background:var(--accent);border-color:var(--accent);}
  .chip .dot{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:6px;vertical-align:middle;}
  .chip.review-toggle{margin-left:auto;}
  .chip.review-toggle.active{background:var(--review);border-color:var(--review);}

  /* ---------- Card ---------- */
  .stage{perspective:1600px;margin:16px 0 10px;}
  .card{
    position:relative;width:100%;min-height:320px;cursor:pointer;outline:none;
    --accent:var(--pip);
    user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  .card-inner{
    position:relative;width:100%;min-height:320px;
    transform-style:preserve-3d;
    transition:transform .5s cubic-bezier(.35,.1,.25,1);
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    border:1px solid var(--line);border-radius:var(--radius);
    background:linear-gradient(160deg,var(--panel),var(--bg2));
    padding:26px 24px;display:flex;flex-direction:column;
    box-shadow:0 20px 50px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03);
    overflow:auto;
  }
  .face::before{
    content:"";position:absolute;left:0;top:0;height:100%;width:4px;
    background:var(--accent);opacity:.9;transition:background .3s ease;
  }
  .face.back{transform:rotateY(180deg);}
  .face.back{background:linear-gradient(160deg,#181f2e,#111623);}

  .meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:auto;}
  .eyebrow{
    font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.15em;text-transform:uppercase;
    color:var(--accent);font-weight:600;transition:color .3s ease;display:flex;align-items:center;gap:8px;
  }
  .eyebrow .num{color:var(--muted-2);}
  .flag{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);}
  .flag.known{color:var(--ok);border-color:rgba(74,222,128,.4);}
  .flag.review{color:var(--review);border-color:rgba(251,191,36,.4);}

  .qlabel{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-2);margin:0 0 10px;}
  .qtext{
    font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:22px;line-height:1.32;margin:0;
    letter-spacing:-.01em;
  }
  .qtext code{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:.84em;letter-spacing:0;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px;color:#cfe0ff;overflow-wrap:anywhere;}
  .atext{font-size:17px;line-height:1.55;margin:0;color:#eef0f7;}
  .atext code{font-family:"JetBrains Mono",monospace;font-size:.9em;background:rgba(255,255,255,.06);padding:1px 6px;border-radius:6px;color:#cfe0ff;overflow-wrap:anywhere;}
  .hint{
    margin-top:auto;padding-top:16px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted-2);
    display:flex;align-items:center;gap:8px;
  }
  .hint kbd{background:var(--line);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted);font-family:inherit;font-size:10px;}

  /* ---------- Controls ---------- */
  .nav{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .btn{
    font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:500;
    border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:12px 14px;cursor:pointer;transition:all .16s ease;display:flex;align-items:center;justify-content:center;gap:7px;
    user-select:none;
  }
  .btn:hover{border-color:var(--muted-2);background:#1e2333;}
  .btn:active{transform:translateY(1px);}
  .btn.icon{width:48px;flex:0 0 auto;font-size:16px;}
  .btn.flip{flex:1;background:var(--accent);border-color:var(--accent);color:#0e1016;font-weight:600;transition:background .3s ease,transform .16s ease;}
  .btn.flip:hover{filter:brightness(1.06);}
  .actions{display:flex;gap:10px;margin-top:10px;}
  .btn.rev{flex:1;color:var(--review);border-color:rgba(251,191,36,.3);}
  .btn.rev:hover{background:rgba(251,191,36,.08);}
  .btn.know{flex:1;color:var(--ok);border-color:rgba(74,222,128,.3);}
  .btn.know:hover{background:rgba(74,222,128,.08);}
  .tools{display:flex;gap:10px;margin-top:10px;}
  .btn.ghost{flex:1;color:var(--muted);font-size:12px;padding:10px;}

  .empty{
    text-align:center;padding:60px 20px;color:var(--muted);
    font-family:"JetBrains Mono",monospace;font-size:13px;line-height:1.8;
  }
  .empty b{color:var(--ink);font-weight:600;}

  footer{margin-top:22px;text-align:center;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--muted-2);line-height:1.7;}

  @media (max-width:520px){
    .wrap{padding:18px 14px 48px;}
    .brand h1{font-size:22px;}
    .qtext{font-size:20px;}
    .stats{font-size:11px;}
    .hint{display:none;}
    .face{padding:22px 18px;}
  }
  @media (prefers-reduced-motion:reduce){
    .card-inner{transition:none;}
    .rail>span{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="kicker">Microsoft DevOps Engineer</span>
      <h1>AZ&#8209;400 <b id="brandAccent">· Cartes</b></h1>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="rail"><span id="railFill"></span></div>

  <div class="filters" id="filters"></div>

  <div class="stage">
    <div class="card" id="card" tabindex="0" role="button" aria-label="Carte de révision, cliquer pour retourner">
      <div class="card-inner">
        <div class="face front">
          <div class="meta">
            <span class="eyebrow" id="feyebrow"></span>
            <span class="flag" id="fflag"></span>
          </div>
          <p class="qlabel">Question</p>
          <p class="qtext" id="qtext"></p>
          <div class="hint"><kbd>Espace</kbd> retourner · <kbd>←</kbd> <kbd>→</kbd> naviguer</div>
        </div>
        <div class="face back">
          <div class="meta">
            <span class="eyebrow" id="beyebrow"></span>
            <span class="flag" id="bflag"></span>
          </div>
          <p class="qlabel">Réponse</p>
          <p class="atext" id="atext"></p>
          <div class="hint"><kbd>J</kbd> je sais · <kbd>R</kbd> à revoir · <kbd>S</kbd> mélanger</div>
        </div>
      </div>
    </div>
    <div class="empty" id="empty" style="display:none"></div>
  </div>

  <div class="nav" id="nav">
    <button class="btn icon" id="prev" aria-label="Précédent">◀</button>
    <button class="btn flip" id="flip">Retourner</button>
    <button class="btn icon" id="next" aria-label="Suivant">▶</button>
  </div>
  <div class="actions" id="actions">
    <button class="btn rev" id="markRev">À revoir</button>
    <button class="btn know" id="markKnow">Je sais</button>
  </div>
  <div class="tools">
    <button class="btn ghost" id="shuffle">↺ Mélanger</button>
    <button class="btn ghost" id="reset">Réinitialiser</button>
  </div>

  <footer id="foot">
    182 cartes · pièges d'examen &amp; astuces inclus<br>
    Progression sauvegardée sur cet appareil.<br>
    <a href="index.html" style="color:var(--muted-2)">À propos, code source &amp; contributions</a>
  </footer>
</div>

<script>
/* ---------- Données ---------- */
const DOMAINS = {
  proc:{label:"Concevoir et implémenter des processus et des communications",             short:"Processus & Communication", color:"var(--proc)"},
  src: {label:"Concevoir et implémenter une stratégie de contrôle de code source",        short:"Code source",               color:"var(--src)"},
  pip: {label:"Concevoir et implémenter des pipelines de build et de mise en production", short:"Pipelines",                 color:"var(--pip)"},
  sec: {label:"Développer un plan de sécurité et de conformité",                          short:"Sécurité & Conformité",     color:"var(--sec)"},
  ins: {label:"Implémenter une stratégie d'instrumentation",                              short:"Instrumentation",           color:"var(--ins)"},
  pie: {label:"Pièges d'examen",                                                          short:"Pièges",                    color:"var(--pie)"},
  eqv: {label:"GitHub ↔ Azure DevOps",                                                    short:"GitHub ↔ Azure DevOps",     color:"var(--eqv)"},
  cmd: {label:"Syntaxe et commandes",                                                     short:"Syntaxe",                   color:"var(--cmd)"},
  tip: {label:"Astuces réflexes",                                                         short:"Astuces",                   color:"var(--tip)"},
};

const CARDS = [
  // ===== D1 Processus & Communication =====
  {d:"proc", q:"Ton backlog doit être filtré par équipe, sans aucune notion de date. Area Path ou Iteration Path ?", a:"<b>Area Path.</b> Il dit où et qui (équipe, composant). L'Iteration Path dit quand (sprint, dates)."},
  {d:"proc", q:"Projet Azure Boards en process <b>Scrum</b> : quel work item porte les besoins du backlog ?", a:"<b>Product Backlog Item (PBI).</b> Agile : User Story · CMMI : Requirement · Basic : Issue."},
  {d:"proc", q:"GitHub : une feature s'étale sur 3 dépôts. Milestone ou Project pour la suivre ?", a:"<b>Project.</b> Il couvre plusieurs dépôts. Un Milestone reste limité à un seul dépôt."},
  {d:"proc", q:"Tu veux voir si du périmètre a été ajouté en cours de sprint. Burnup ou burndown ?", a:"<b>Burnup.</b> Il montre l'évolution du périmètre. Le burndown la masque."},
  {d:"proc", q:"Un commit GitHub contient <code>Fixes AB#142</code>. Que se passe-t-il dans Azure Boards ?", a:"<b>Le lien est créé et le work item passe à l'état résolu.</b> Sans mot-clé devant, <code>AB#142</code> crée seulement le lien."},
  {d:"proc", q:"Un commit GitHub mentionne <code>AB#142</code>, mais aucun lien n'apparaît dans Boards. Que vérifies-tu ?", a:"<b>La connexion GitHub du projet</b> (Project Settings → GitHub connections). Sans elle, <code>AB#</code> ne fait rien."},
  {d:"proc", q:"Tu veux une documentation versionnée <b>avec le code</b>, qui suit ses branches. Wiki de projet ou wiki publié ?", a:"<b>Wiki publié</b> (dossier d'un dépôt de code). Le wiki de projet vit dans un dépôt dédié, à côté du code."},
  {d:"proc", q:"Un nouveau projet Azure DevOps n'a pas de wiki. Normal ? Qui peut le créer ?", a:"<b>Oui, il n'est jamais créé automatiquement.</b> Il faut la permission Create Repository (Project Administrators)."},
  {d:"proc", q:"Tu veux un diagramme d'architecture écrit en texte, versionné dans le wiki. Quelle syntaxe ?", a:"<b>Mermaid</b> (<code>graph TD</code>, <code>sequenceDiagram</code>…). Le diagramme se relit et se corrige comme du code."},
  {d:"proc", q:"L'équipe veut approuver un déploiement Azure Pipelines sans quitter Teams. Que faut-il ?", a:"<b>L'app Azure Pipelines pour Teams.</b> Prérequis : l'accès OAuth des applications tierces autorisé dans l'organisation."},

  // ===== D2 Code source =====
  {d:"src", q:"Quelle stratégie de branchement garde le moins de branches de longue durée ?", a:"<b>Trunk-based development.</b> <code>main</code>, des branches de moins de 2 jours et des feature flags."},
  {d:"src", q:"Releases planifiées avec <code>develop</code>, <code>release/*</code> et <code>hotfix/*</code> : quel modèle ?", a:"<b>GitFlow.</b> Lourd, inadapté au déploiement continu, contrairement à GitHub Flow (main + branches courtes)."},
  {d:"src", q:"Peut-on lancer un rebase sur une branche déjà poussée et partagée ?", a:"<b>Non.</b> Le rebase réécrit l'historique : les copies des collègues divergent."},
  {d:"src", q:"Dans un énoncé en français, que désigne une « validation atomique » ?", a:"<b>Un atomic commit</b> : une seule modification logique, annulable seule avec <code>git revert</code>."},
  {d:"src", q:"Toute modification de <code>/security/*</code> doit être relue par l'équipe Sécurité. Quelle branch policy ?", a:"<b>Automatically included reviewers</b>, par chemin. Minimum number of reviewers accepte n'importe quel relecteur."},
  {d:"src", q:"Chaque pull request doit arriver sur <code>main</code> en un seul commit. Quelle branch policy ?", a:"<b>Limit merge types</b>, en n'autorisant que <b>Squash commit</b>."},
  {d:"src", q:"La validation d'une PR doit venir d'un service externe, pas d'un pipeline Azure. Quelle branch policy ?", a:"<b>Status checks.</b> Build validation exige qu'un pipeline Azure passe au vert."},
  {d:"src", q:"Hook Git ou branch policy pour bloquer du code non conforme ?", a:"<b>Les deux.</b> Le hook donne un retour rapide mais se contourne. La policy garantit, côté serveur."},
  {d:"src", q:"Inner source : tu veux corriger le code d'une autre équipe sans droit d'écriture sur son dépôt. Comment ?", a:"<b>Fork + pull request.</b> Tous les dépôts sont lisibles, on propose sans écrire directement."},
  {d:"src", q:"Pull request d'un fork vers le dépôt d'origine : quelles branch policies s'appliquent ?", a:"<b>Celles du dépôt de destination.</b> Le fork n'en a copié aucune."},
  {d:"src", q:"Une branche a été supprimée par erreur. Quelle commande retrouve son dernier commit ?", a:"<b><code>git reflog</code></b>, le journal des déplacements de HEAD. <code>git log</code> ne le montre plus."},

  // ===== D3 Pipelines : tests =====
  {d:"pip", q:"Shift-left dans une stratégie de test : tester moins, ou autrement ?", a:"<b>Tester plus tôt</b>, pas moins. But : arrêter les défauts avant la fusion du code."},
  {d:"pip", q:"Un test utilise une vraie base de données, sans service déployé. Quel niveau de la taxonomie L0 à L3 ?", a:"<b>L1.</b> L0 : en mémoire · L2 : service déployé, dépendances stubbées · L3 : production complète."},
  // --- Pipelines ---
  {d:"pip", q:"Un job compile, un autre job déploie. Comment le second récupère-t-il les fichiers ?", a:"<b>Par un artefact</b>, publié puis téléchargé. Chaque job peut tourner sur une machine différente."},
  {d:"pip", q:"Une modification de pipeline s'applique à tous, tout de suite, sans revue. Classic ou YAML ?", a:"<b>Classic.</b> Le YAML vit dans le dépôt : revu par PR, versionné, différent par branche."},
  {d:"pip", q:"Un agent self-hosted est derrière le pare-feu. Quel port entrant ouvrir ?", a:"<b>Aucun.</b> L'agent se connecte en HTTPS 443 sortant."},
  {d:"pip", q:"Une étape doit seulement appeler une API REST et attendre, sans machine. Quel type de job ?", a:"<b>Agentless job</b> (server job) : il tourne sur les serveurs Azure DevOps."},
  {d:"pip", q:"Un job ne doit tourner que sur les agents du pool équipés de Java 17. Quel mécanisme ?", a:"<b>Des demands</b> sur les capabilities de l'agent."},
  {d:"pip", q:"Niveau gratuit, agents Microsoft-hosted, projet privé : quelles limites ?", a:"<b>1 job parallèle · 60 min par job · 1 800 min par mois.</b>"},
  {d:"pip", q:"Une matrice de 3 configurations tourne avec 1 seul parallel job. Que se passe-t-il ?", a:"<b>Les 3 tournent en série.</b> N configurations simultanées = N parallel jobs."},
  {d:"pip", q:"Tu veux partager les mêmes étapes entre 20 pipelines YAML. Quel mécanisme ?", a:"<b>Un template</b> (<code>- template: fichier.yml</code>). 4 types : stage, job, step, variable."},
  {d:"pip", q:"Un pipeline doit démarrer à la fin d'un autre et consommer ses artefacts. Que déclarer ?", a:"<b><code>resources: pipelines:</code></b> avec <code>source:</code> et <code>trigger: true</code>."},
  {d:"pip", q:"Les tests ont besoin d'une base de données qui tourne à côté du job. Container job ou service container ?", a:"<b>Service container.</b> Dans un container job, les étapes tournent dans le conteneur."},
  {d:"pip", q:"Ton pipeline Azure doit extraire un dépôt GitHub. Que déclarer ?", a:"<b><code>resources: repositories:</code></b> avec <code>type: github</code> et <code>endpoint:</code> (connexion de service)."},
  {d:"pip", q:"Sur quelles branches la CI d'un pipeline YAML se déclenche-t-elle par défaut ?", a:"<b>Toutes.</b> Restreindre avec <code>trigger: branches: include/exclude</code>. Les PR se déclarent sous <code>pr:</code>."},
  {d:"pip", q:"Faut-il recompiler le code avant la production, après validation en staging ?", a:"<b>Non : build once, deploy many.</b> Seule la configuration change d'un environnement à l'autre."},
  {d:"pip", q:"La release doit attendre tant qu'un bug bloquant est ouvert dans Boards. Quel type de gate ?", a:"<b>Requête sur les work items.</b> Elle vérifie un seuil, par exemple zéro bug bloquant."},
  {d:"pip", q:"Après un canary, on veut promouvoir seulement si aucune alerte ne se déclenche. Quelle gate ?", a:"<b>Gate post-déploiement</b> sur les <b>alertes Azure Monitor</b>."},
  // --- Déploiement ---
  {d:"pip", q:"Zéro interruption et retour arrière en quelques secondes, avec deux environnements identiques. Quel modèle ?", a:"<b>Blue-green.</b> L'ancien environnement reste en secours après la bascule."},
  {d:"pip", q:"Quelle fonctionnalité d'App Service implémente le blue-green ?", a:"<b>Les deployment slots</b>, avec un swap entre staging et production."},
  {d:"pip", q:"Envoyer 5 % du trafic sur la nouvelle version pour vérifier qu'elle ne casse rien. Quel modèle ?", a:"<b>Canary.</b> Objectif : maîtriser le risque."},
  {d:"pip", q:"Plusieurs phases successives, sur des cohortes d'utilisateurs choisies, une phase par stage. Quel modèle ?", a:"<b>Déploiement en anneaux</b> (ring-based)."},
  {d:"pip", q:"Comparer deux versions d'une page sur le taux de conversion. Quel modèle ?", a:"<b>A/B testing.</b> Objectif : une métrique métier, pas la stabilité."},
  {d:"pip", q:"Le code est prêt, mais la fonctionnalité ne doit être visible que dans 2 semaines. Comment déployer dès maintenant ?", a:"<b>Avec un feature flag</b> éteint, allumé le moment venu, sans redéploiement."},
  {d:"pip", q:"GitHub Actions : comment exiger une approbation avant le job qui déploie en production ?", a:"<b><code>environment: production</code></b>, avec des règles de protection (approbateurs requis)."},
  // --- IaC et configuration ---
  {d:"pip", q:"Tu décris l'état final voulu, l'outil calcule l'ordre. Déclaratif ou impératif ?", a:"<b>Déclaratif</b> (Bicep, Terraform). Impératif : les étapes, dans l'ordre (CLI, PowerShell)."},
  {d:"pip", q:"Quelles sont les 3 sections obligatoires d'un template ARM ?", a:"<b><code>$schema</code>, <code>contentVersion</code>, <code>resources</code>.</b> Le reste (parameters, variables, outputs…) est facultatif."},
  {d:"pip", q:"Quel mode de déploiement utiliser pour un template ARM lié ou imbriqué (linked, nested) ?", a:"<b>Incremental.</b>"},
  {d:"pip", q:"Un template ARM a besoin d'un mot de passe sans l'écrire en clair. Où le référencer ?", a:"<b>Dans le fichier de paramètres</b>, par une <b>référence Key Vault</b> (ID du coffre + nom du secret)."},
  {d:"pip", q:"Tu as modifié un runbook, mais les exécutions utilisent encore l'ancienne version. Que manque-t-il ?", a:"<b>Publier le runbook</b> (Publish). Le brouillon n'est jamais exécuté en production."},
  {d:"pip", q:"Exécuter des runbooks sur des serveurs locaux, sans aucun port entrant. Comment ?", a:"<b>Hybrid Runbook Worker</b>, en TCP 443 sortant."},
  {d:"pip", q:"Bicep : par quoi remplace-t-on le template lié d'ARM ?", a:"<b>Le mot-clé <code>module</code></b>, qui pointe vers un fichier local. Plus besoin d'URI ni de jeton SAS."},
  {d:"pip", q:"Déployer un template ARM ou Bicep depuis GitHub Actions : quelle action ?", a:"<b><code>azure/arm-deploy@v1</code></b>, après <code>azure/login</code>. <code>AzureCLI@2</code> est une tâche Azure Pipelines."},
  // --- Santé des pipelines ---
  {d:"pip", q:"Les builds attendent avant de démarrer. Quelle métrique, quelle action ?", a:"<b>Queue time</b> → ajouter des agents ou des parallel jobs."},
  {d:"pip", q:"Seuils d'alerte sur la durée d'un pipeline : quelles valeurs par rapport à la baseline ?", a:"<b>Avertissement × 1,5 · critique × 2</b>, sur une <b>violation soutenue</b>, pas au premier dépassement."},
  {d:"pip", q:"Un test instable (flaky) fait échouer le pipeline de toute l'équipe. Que faire en attendant ?", a:"<b>Le mettre en quarantaine</b> : il tourne à part, sans bloquer. Jamais le supprimer."},
  // --- Packages ---
  {d:"pip", q:"Mêmes versions exactes de dépendances sur tous les environnements : lock file ou plage de versions ?", a:"<b>Lock file.</b> La plage accepte les mises à jour compatibles."},
  {d:"pip", q:"Plusieurs équipes, couplage faible, releases indépendantes : composants par le source ou par package ?", a:"<b>Par package.</b> Par le source : une équipe, couplage fort, même dépôt."},
  {d:"pip", q:"Azure Artifacts peut-il héberger des images Docker ?", a:"<b>Non → ACR.</b> Azure Artifacts : NuGet, npm, Maven, Python, Universal Packages."},
  {d:"pip", q:"De gros binaires sont stockés dans Git. Où les mettre dans Azure Artifacts ?", a:"<b>Universal Packages.</b>"},
  {d:"pip", q:"Les développeurs veulent une seule configuration pour les packages privés et publics. Quel mécanisme ?", a:"<b>Une source en amont</b> (upstream) : le flux privé interroge le public et garde une copie en cache."},
  {d:"pip", q:"Rôle d'un flux : enregistrer des packages depuis l'amont, sans pouvoir publier. Lequel ?", a:"<b>Collaborator.</b> Reader : lire · Contributor : publier · Owner : administrer."},
  {d:"pip", q:"Un pipeline publie dans un flux sans aucune configuration de droits. Pourquoi ça marche ?", a:"<b>Project Collection Build Service est Contributor</b> par défaut. Une identité de build au niveau projet doit, elle, être ajoutée."},
  {d:"pip", q:"La production ne doit consommer que les packages validés du flux MyFeed. Quelle URL ?", a:"<b><code>MyFeed@Release</code>.</b> Sans vue, l'URL pointe sur @Local, qui contient tout."},
  {d:"pip", q:"Un package de l'amont manque dans @Release. Comment l'y amener ?", a:"<b>Le consommer via @Local</b> (mise en cache), <b>puis le promouvoir</b>. L'amont n'est consulté que via @Local."},
  {d:"pip", q:"Une version de package doit survivre à la politique de rétention du flux. Que faire ?", a:"<b>La promouvoir</b> dans une vue : les packages promus sont protégés."},
  {d:"pip", q:"SemVer : <code>1.0.0-beta.2</code> ou <code>1.0.0-beta.11</code>, laquelle est la plus récente ?", a:"<b><code>beta.11</code>.</b> Les parties numériques se comparent comme des nombres."},
  {d:"pip", q:"Une version de package publiée est cassée. Tu la republies corrigée sous le même numéro ?", a:"<b>Non : nouvelle version</b> (1.2.3 → 1.2.4). Un package publié est immuable."},
  {d:"pip", q:"Une version vulnérable ne doit plus apparaître en recherche, sans casser les builds qui l'utilisent. Que fais-tu ?", a:"<b>Unlist.</b> Supprimer casserait les builds."},
  {d:"pip", q:"Un pipeline Azure doit consommer un flux externe à Azure DevOps. Comment s'authentifier ?", a:"<b>Une connexion de service</b> (NuGet, npm ou générique). Dans Azure DevOps, c'est transparent."},
  {d:"pip", q:"Migrer un gros dépôt de packages, utilisé par beaucoup d'équipes, sans coupure. Quelle stratégie ?", a:"<b>Migration progressive</b> : Azure Artifacts en principal, l'ancien dépôt en <b>source en amont</b>."},
  {d:"pip", q:"Workflow GitHub qui publie dans GitHub Packages : quelle identité, quel réglage ?", a:"<b><code>GITHUB_TOKEN</code> + <code>permissions: packages: write</code>.</b> Sans ce réglage, l'écriture est refusée."},
  {d:"pip", q:"Une version <b>publique</b> de GitHub Packages a 9 000 téléchargements et une faille. Peut-on la supprimer ?", a:"<b>Non</b> (au-delà de 5 000). On la déprécie et on publie une version corrigée. Une version privée se supprime librement."},

  // ===== D4 Sécurité & Conformité =====
  {d:"sec", q:"Microsoft Entra ID : lequel reçoit réellement les permissions dans le tenant, l'application ou le service principal ?", a:"<b>Le service principal.</b> L'application est le modèle. Une managed identity est un service principal géré par Azure."},
  {d:"sec", q:"Une identité doit disparaître automatiquement avec la VM qui l'utilise. System-assigned ou user-assigned ?", a:"<b>System-assigned.</b> La user-assigned est indépendante et peut servir à plusieurs ressources."},
  {d:"sec", q:"Un outil interne lit les PR de 40 dépôts GitHub. GitHub App ou OAuth App ?", a:"<b>GitHub App</b> : identité propre, droits fins, jetons courts. L'OAuth App agit au nom d'un utilisateur."},
  {d:"sec", q:"Pipeline qui lit Key Vault : quelle méthode limite le plus l'exposition des identifiants ?", a:"<b>Connexion de service avec identité managée.</b> Jamais de chaîne de connexion dans une variable ou le YAML."},
  {d:"sec", q:"La connexion de service de production est utilisable par tous les pipelines. Que changer ?", a:"<b>Désactiver « Grant access permission to all pipelines ».</b> Et une connexion par environnement."},
  // --- DevSecOps et analyse ---
  {d:"sec", q:"Tester l'application en cours d'exécution en staging, en simulant des attaques. SAST ou DAST ?", a:"<b>DAST.</b> SAST : le code source, sans l'exécuter."},
  {d:"sec", q:"À quel moment du pipeline lancer le scan du code source ?", a:"<b>Après le build, avant les tests.</b>"},
  {d:"sec", q:"L'équipe sécurité valide chaque release à la main et bloque 3 déploiements par jour. Que propose DevSecOps ?", a:"<b>Valider le processus CI/CD</b> et ses contrôles automatiques, plus chaque release."},
  {d:"sec", q:"Threat modeling : « un client nie avoir passé une commande, rien ne prouve le contraire ». Catégorie STRIDE ?", a:"<b>Repudiation</b> → contre-mesure : des logs d'audit."},
  {d:"sec", q:"Outil gratuit qui propose les menaces à partir du diagramme d'architecture et se relie aux work items ?", a:"<b>Microsoft Threat Modeling Tool.</b>"},
  {d:"sec", q:"CodeQL dans Azure Pipelines : comment ?", a:"<b>La CLI CodeQL</b> : <code>database create</code>, <code>database analyze</code>, export <b>SARIF</b>."},
  {d:"sec", q:"Une faille est publiée dans une bibliothèque que tu utilises. CodeQL ou Dependabot ?", a:"<b>Dependabot</b> : les dépendances. CodeQL : ton propre code."},
  // --- Licences ---
  {d:"sec", q:"Ton logiciel propriétaire vendu utilise une bibliothèque MIT. Que dois-tu faire ?", a:"<b>Garder la mention de copyright et la licence</b> (attribution). Ton code reste secret."},
  {d:"sec", q:"Appli propriétaire + bibliothèque LGPL non modifiée, en liaison dynamique. Dois-tu publier ton code ?", a:"<b>Non.</b> Seules les modifications de la bibliothèque devraient être publiées."},
  {d:"sec", q:"Deux bibliothèques équivalentes, MIT et Apache 2.0. Le juridique craint les procès en brevets. Laquelle ?", a:"<b>Apache 2.0</b> : concession explicite de brevets. MIT n'en parle pas."},
  // --- SCA ---
  {d:"sec", q:"Dependabot doit proposer chaque semaine des mises à jour, même sans faille. Comment ?", a:"<b>Version updates</b> : fichier <code>.github/dependabot.yml</code> avec un <code>schedule</code>."},
  {d:"sec", q:"Dépôt GitHub <b>privé</b> : aucune alerte Dependabot alors qu'une dépendance est vulnérable. Que vérifier ?", a:"<b>Dependency graph et Dependabot alerts activés.</b> Ils ne le sont pas par défaut sur un privé."},
  {d:"sec", q:"Code dans Azure Repos : le build doit échouer si une dépendance viole la politique, licences comprises. Quelle tâche ?", a:"<b><code>WhiteSource@21</code></b> (Mend) avec <code>failBuildOnPolicyViolation: true</code>."},
  {d:"sec", q:"Outil SCA gratuit, open source, basé sur la NVD ?", a:"<b>OWASP Dependency-Check</b> (<code>--failOnCVSS 7</code>). Pas de PR automatique."},
  {d:"sec", q:"Une CVE sort sur une dépendance alors que ton dépôt n'a pas bougé depuis 3 semaines. Comment la détecter ?", a:"<b>Un scan planifié</b> (<code>schedules:</code> avec <code>always: true</code>)."},
  {d:"sec", q:"Le client exige la liste complète des composants à chaque version, au format standard. Que produire ?", a:"<b>Un SBOM CycloneDX ou SPDX</b>, publié comme artefact du pipeline."},
  {d:"sec", q:"Scanner automatiquement les images poussées dans ACR et les rescanner régulièrement. Quel service ?", a:"<b>Microsoft Defender for Containers.</b>"},
  // --- Gouvernance Azure ---
  {d:"sec", q:"Defender for Cloud : CSPM ou CWP pour détecter une attaque en cours sur une VM ?", a:"<b>CWP</b> (les Defender plans). CSPM : la posture de configuration (Secure Score, recommandations)."},
  {d:"sec", q:"Nouvel abonnement : Secure Score et recommandations, sans rien payer. Que faut-il ?", a:"<b>Rien : Foundational CSPM</b> est gratuit et actif par défaut."},
  {d:"sec", q:"Le port RDP doit rester fermé et s'ouvrir sur demande, pour une durée limitée. Quelle fonctionnalité ?", a:"<b>Just-in-time VM access</b> (Defender for Servers)."},
  {d:"sec", q:"Policy : une ressource hors Europe doit être refusée dès sa création. Quel effet ?", a:"<b>Deny.</b> Audit signale sans bloquer."},
  {d:"sec", q:"Policy : ajouter automatiquement un tag <code>CostCenter</code> oublié. Quel effet ?", a:"<b>Modify.</b>"},
  {d:"sec", q:"Policy : déployer les paramètres de diagnostic manquants. Quel effet ?", a:"<b>DeployIfNotExists.</b> Pour les ressources déjà existantes : une <b>tâche de remédiation</b>."},
  {d:"sec", q:"Appliquer 100+ policies d'un référentiel en une seule assignation, avec un seul % de conformité ?", a:"<b>Une initiative</b> (policy set), par exemple Azure Security Benchmark."},
  {d:"sec", q:"Personne, même un Owner, ne doit supprimer la base de prod, mais on doit pouvoir la modifier. Quel verrou ?", a:"<b>CanNotDelete.</b> ReadOnly bloquerait aussi la modification."},
  {d:"sec", q:"Code scanning et secret scanning natifs pour du code dans Azure Repos ?", a:"<b>GitHub Advanced Security for Azure DevOps.</b>"},
  {d:"sec", q:"Arrêter un secret au moment du <code>git push</code>, avant qu'il entre dans le dépôt. Quoi activer ?", a:"<b>Push protection.</b> Le secret scanning seul détecte après coup."},

  // ===== D5 Instrumentation =====
  {d:"ins", q:"Azure Monitor, Log Analytics, Application Insights : lequel est le magasin de logs interrogé en KQL ?", a:"<b>Log Analytics.</b> Azure Monitor : le parapluie · Application Insights : l'APM de l'application."},
  {d:"ins", q:"Suivre un événement métier personnalisé (« panier validé ») dans Application Insights. Runtime instrumentation ou SDK ?", a:"<b>SDK</b>, dans le code. La runtime instrumentation ne touche pas au code mais ne voit pas le métier."},
  {d:"ins", q:"Voir sur les courbes qu'une dégradation coïncide avec un déploiement. Quoi utiliser ?", a:"<b>Release annotations.</b>"},
  {d:"ins", q:"5 000 requêtes/min le jour, 500 la nuit. Quel type de seuil d'alerte ?", a:"<b>Dynamic thresholds</b> : baseline apprise, saisonnalité prise en compte."},
  {d:"ins", q:"Être alerté d'une anomalie dans Application Insights sans avoir défini de seuil ?", a:"<b>Smart Detection</b> (baseline de 8 jours)."},
  {d:"ins", q:"Valider un déploiement en temps réel, à la seconde ?", a:"<b>Live Metrics Stream.</b>"},
  {d:"ins", q:"Système distribué : quel composant pose problème ?", a:"<b>Application Map.</b>"},
  {d:"ins", q:"Bug de production impossible à reproduire : tu veux la valeur des variables au moment de l'exception.", a:"<b>Snapshot Debugger.</b> Le Profiler dit quelle méthode prend du temps."},
  {d:"ins", q:"Afficher un tableau de résultats de logs interactif, avec filtres et drill-down. Dashboard ou workbook ?", a:"<b>Workbook.</b> Le dashboard sert à surveiller et n'affiche pas de tableau de logs."},
  {d:"ins", q:"KQL : quel filtre placer en premier ?", a:"<b>Le filtre de temps</b> (<code>where TimeGenerated &gt; ago(24h)</code>), colonne indexée."},
  {d:"ins", q:"Cluster AKS : quel Insights surveille les pods et les conteneurs ?", a:"<b>Container Insights.</b> VM Insights : les machines virtuelles."},
  {d:"ins", q:"Une alerte Azure Monitor doit créer un incident dans ServiceNow. Quel mécanisme ?", a:"<b>ITSMC</b> (IT Service Management Connector). Pour un work item Azure Boards : work items integration."},
  {d:"ins", q:"Une alerte doit réveiller quelqu'un la nuit. Quel critère principal ?", a:"<b>Urgente, importante, actionnable et réelle</b>, sur un symptôme visible par l'utilisateur, pas sur le CPU."},

  // ===== Pièges d'examen =====
  // --- Processus ---
  {d:"pie", q:"Piège 1 · Processus · Commit GitHub : <code>AB#142 fixed</code>. Le work item change-t-il d'état ?", a:"<b>Non.</b> Le mot-clé doit précéder : <code>Fixed AB#142</code>. Ici, simple lien."},
  {d:"pie", q:"Piège 2 · Processus · Message Slack quand un build échoue : notification ou service hook ?", a:"<b>Service hook</b> : l'événement sort d'Azure DevOps. Même réponse pour Teams, Trello, Jenkins."},
  // --- Git ---
  {d:"pie", q:"Piège 3 · Git · Depuis une feature branch, <code>git rebase main</code> modifie-t-il <code>main</code> ?", a:"<b>Non.</b> Il rejoue les commits de la feature au-dessus de main."},
  {d:"pie", q:"Piège 4 · Git · Une PR a ses 2 approbations requises. Est-ce la preuve que le code compile ?", a:"<b>Non.</b> Il faut aussi la policy <b>Build validation</b>."},
  {d:"pie", q:"Piège 5 · Git · Un hook pre-commit anti-secrets garantit-il qu'aucun secret n'est commité ?", a:"<b>Non</b> (<code>--no-verify</code>). « Garantir » = contrôle côté serveur."},
  {d:"pie", q:"Piège 6 · Git · Un build n'a besoin que du dernier commit d'un gros dépôt : shallow clone ou VFS for Git ?", a:"<b>Shallow clone</b> (<code>--depth 1</code>). VFS for Git : dépôt trop gros pour le disque."},
  {d:"pie", q:"Piège 7 · Git · <code>git rm</code> + commit retire-t-il un fichier sensible de l'historique ?", a:"<b>Non.</b> Réécrire l'historique : <code>git filter-repo</code> ou BFG."},
  {d:"pie", q:"Piège 8 · Git · Secret purgé de tout l'historique : l'incident est-il clos ?", a:"<b>Non : il faut révoquer le secret.</b> Il a pu être copié entre-temps."},
  // --- Pipelines ---
  {d:"pie", q:"Piège 9 · Pipelines · Sous <code>resources:</code>, déclare-t-on les agents ?", a:"<b>Non.</b> Des dépendances externes : pipelines, repositories, containers. L'agent : <code>pool:</code>."},
  {d:"pie", q:"Piège 10 · Pipelines · Quand une condition <code>${{ if }}</code> est-elle évaluée ?", a:"<b>À la compilation</b>, avant l'exécution."},
  {d:"pie", q:"Piège 11 · Pipelines · Une approbation qui dure 3 jours bloque-t-elle un parallel job ?", a:"<b>Non.</b> Ne consomment pas de parallel job : agentless, deployment group, attente d'approbation."},
  {d:"pie", q:"Piège 12 · Pipelines · Réutiliser un task group dans un pipeline YAML ?", a:"<b>Non : Classic seulement.</b> En YAML : un template."},
  {d:"pie", q:"Piège 13 · GitHub Actions · Un job GitHub-hosted est-il coupé au bout de 60 minutes ?", a:"<b>Non : 6 heures.</b> Les 60 min sont la limite Azure Pipelines gratuit, projet privé."},
  {d:"pie", q:"Piège 14 · GitHub Actions · <code>deploy</code> ne trouve pas l'artefact de <code>build</code>. Que manque-t-il ?", a:"<b><code>needs: build</code>.</b> Sans lui, les jobs partent en parallèle."},
  {d:"pie", q:"Piège 15 · GitHub Actions · Une variable <code>export</code> survit-elle au step suivant ?", a:"<b>Non.</b> Utiliser <code>echo 'NOM=valeur' &gt;&gt; $GITHUB_ENV</code>."},
  {d:"pie", q:"Piège 16 · GitHub Actions · <code>@v4</code> est-il aussi sûr qu'un SHA de commit ?", a:"<b>Non.</b> Un tag se déplace, un SHA est immuable."},
  {d:"pie", q:"Piège 17 · Conteneurs · <code>RUN</code> et <code>CMD</code> sont-ils interchangeables ?", a:"<b>Non.</b> RUN : à la construction · CMD : à chaque démarrage du conteneur."},
  {d:"pie", q:"Piège 18 · Conteneurs · Le multi-stage sert-il seulement à réduire la taille ?", a:"<b>Non : aussi la surface d'attaque</b> (pas de compilateur en production)."},
  {d:"pie", q:"Piège 19 · Conteneurs · Un <code>.env</code> ajouté dans une couche puis supprimé par <code>RUN rm</code> dans la suivante : l'image est-elle sûre ?", a:"<b>Non.</b> Le fichier reste dans l'ancienne couche et l'historique."},
  // --- Release et déploiement ---
  {d:"pie", q:"Piège 20 · Déploiement · Swap sans avoir coché « Deployment slot setting » sur la chaîne de connexion ?", a:"<b>Le réglage suit l'application</b> : la prod se branche sur la base de test."},
  {d:"pie", q:"Piège 21 · Déploiement · Réutiliser un feature flag éteint depuis 6 mois ?", a:"<b>Jamais.</b> Un client a pu le laisser allumé."},
  // --- IaC ---
  {d:"pie", q:"Piège 22 · IaC · Webhook de runbook et service hook : même mécanisme ?", a:"<b>Non, sens inverses.</b> Webhook : l'extérieur déclenche · service hook : Azure DevOps prévient l'extérieur."},
  {d:"pie", q:"Piège 23 · IaC · DSC et Azure Policy font-ils le même travail ?", a:"<b>Non : DSC corrige, Policy empêche.</b>"},
  {d:"pie", q:"Piège 24 · Plateformes · Agent self-hosted pour lancer un runbook Azure Automation sur un serveur local ?", a:"<b>Non : Hybrid Runbook Worker.</b> L'agent self-hosted appartient à Azure Pipelines."},
  // --- Packages ---
  {d:"pie", q:"Piège 25 · Packages · Python : quel fichier fige les dépendances ?", a:"<b><code>requirements.txt</code></b> (pip). <code>package.json</code> = npm."},
  {d:"pie", q:"Piège 26 · Packages · Erreur <b>401</b> sur un flux. Qu'est-ce qui ne va pas ?", a:"<b>Le token</b> : absent, expiré ou mauvaise portée. 401 = « je ne sais pas qui tu es »."},
  {d:"pie", q:"Piège 27 · Packages · Erreur <b>403</b> avec un PAT valide. Qu'est-ce qui ne va pas ?", a:"<b>Les droits</b> : rôle insuffisant sur le flux ou le dépôt. 403 = « je sais qui tu es, c'est non »."},
  {d:"pie", q:"Piège 28 · Packages · Erreur <b>404</b>, ou registre injoignable. Qu'est-ce qui ne va pas ?", a:"<b>Le nom, la portée <code>@OWNER</code> ou l'URL</b> du registre. Pas le token."},
  {d:"pie", q:"Piège 29 · Packages · L'équipe Ops doit tirer une image ghcr.io sans accès au code du dépôt. Possible ?", a:"<b>Oui : droit read sur le package conteneur.</b> Le Container registry a ses propres droits, indépendants du dépôt."},
  {d:"pie", q:"Piège 30 · Packages · PAT pour publier dans GitHub Packages : portée <code>repo</code> ?", a:"<b>Non : <code>write:packages</code>.</b> <code>repo</code> donne accès à tout le code."},
  // --- Sécurité ---
  {d:"pie", q:"Piège 31 · Sécurité · Corriger une injection SQL en chiffrant la connexion ?", a:"<b>Non : requête paramétrée.</b> Le chiffrement protège le transport, pas la construction de la requête."},
  {d:"pie", q:"Piège 32 · Sécurité · Analyser des DLL compilées sans leur code source : SonarQube ?", a:"<b>Non : BinSkim</b> (binaires). SonarQube lit du code source."},
  {d:"pie", q:"Piège 33 · Sécurité · STRIDE : modifier le prix dans la requête avant paiement. Spoofing ?", a:"<b>Non : Tampering</b> (trafiquer une donnée). Spoofing = se faire passer pour quelqu'un."},
  {d:"pie", q:"Piège 34 · Sécurité · SaaS + composant modifié : la GPL t'oblige-t-elle à publier tes modifications ?", a:"<b>Non : c'est l'AGPL.</b> GPL = dès que ça sort de chez toi · AGPL = dès qu'on y accède."},
  {d:"pie", q:"Piège 35 · Sécurité · GPL v2 + Apache 2.0 : compatibles ?", a:"<b>Non.</b> Apache 2.0 est compatible avec la GPL <b>v3</b> seulement."},
  {d:"pie", q:"Piège 36 · Sécurité · CVSS 9.4 en preuve de concept, ou CVSS 7.2 exploitée activement : laquelle d'abord ?", a:"<b>La 7.2 exploitée.</b> L'exploitabilité compte plus que le score."},
  {d:"pie", q:"Piège 37 · Sécurité · Dependabot met-il à jour une dépendance vulnérable tout seul ?", a:"<b>Non.</b> Il ouvre une pull request, à relire et fusionner."},
  {d:"pie", q:"Piège 38 · Sécurité · Déployer sans stocker aucun secret : Key Vault ?", a:"<b>Non : workload identity federation (OIDC).</b> Key Vault stocke un secret, il en reste un."},
  {d:"pie", q:"Piège 39 · Sécurité · Fichier sensible dans un pipeline : quelle tâche ?", a:"<b><code>DownloadSecureFile@1</code></b>. « Secret file » n'existe pas."},
  {d:"pie", q:"Piège 40 · Sécurité · Le pipeline crée une VM mais ne peut pas écrire dans un blob. Que manque-t-il ?", a:"<b>Storage Blob Data Contributor</b>, rôle de données. Contributor ne gère que la ressource."},
  {d:"pie", q:"Piège 41 · Sécurité · Qui administre les pools d'agents, qui administre les service connections ?", a:"<b>Pools : Project Collection Administrators · service connections : Project Administrators.</b>"},
  {d:"pie", q:"Piège 42 · Sécurité · Golden Ticket détecté : Defender for Cloud ?", a:"<b>Non : Defender for Identity</b> (AD sur site). Defender for Cloud : les ressources Azure."},

  // ===== GitHub ↔ Azure DevOps =====
  {d:"eqv", q:"Équivalent Azure Pipelines d'un workflow GitHub Actions ?", a:"<b>Le pipeline.</b> Azure ajoute le niveau <b>stage</b>, absent de GitHub Actions."},
  {d:"eqv", q:"Équivalent Azure d'une action GitHub (<code>uses: actions/setup-node@v3</code>) ?", a:"<b>La task</b> (<code>task: NodeTool@0</code>), sans slash."},
  {d:"eqv", q:"<code>runs-on: ubuntu-latest</code> en Azure Pipelines ?", a:"<b><code>pool: vmImage: 'ubuntu-latest'</code>.</b> Runner = agent."},
  {d:"eqv", q:"Équivalent Azure de <code>needs:</code> ?", a:"<b><code>dependsOn:</code></b>"},
  {d:"eqv", q:"Équivalent GitHub des templates Azure Pipelines ?", a:"<b>Les reusable workflows.</b>"},
  {d:"eqv", q:"Équivalent GitHub des branch policies d'Azure Repos ?", a:"<b>Les branch protection rules.</b> Dans un énoncé Azure Repos, c'est un distracteur."},

  // ===== Syntaxe et commandes =====
  {d:"cmd", q:"Que fait <code>git config core.hooksPath .githooks</code> ?", a:"<b>Git utilise les hooks du dossier <code>.githooks/</code></b>, versionné : c'est ainsi qu'on les partage."},
  {d:"cmd", q:"Traduire en Azure Pipelines : <code>on</code>, <code>uses</code>, <code>with</code>, <code>run</code>, <code>name</code>.", a:"<b><code>trigger</code> · <code>task</code> · <code>inputs</code> · <code>script</code> · <code>displayName</code>.</b>"},
  {d:"cmd", q:"KQL : que font <code>summarize</code> et <code>bin(TimeGenerated, 1m)</code> ?", a:"<b>Agréger par groupe</b> (comme GROUP BY) et <b>découper le temps en tranches</b> d'une minute."},
  {d:"cmd", q:"Bicep : quel décorateur pour un paramètre sensible, jamais journalisé ?", a:"<b><code>@secure()</code></b>. <code>@allowed([...])</code> limite les valeurs."},

  // ===== Astuces réflexes =====
  {d:"tip", q:"Déclencheur : « fichiers Photoshop ou vidéos de 500 Mo dans Git »", a:"→ <b>Git LFS.</b>"},
  {d:"tip", q:"Déclencheur : « historique linéaire strict »", a:"→ <b>Rebase and fast-forward.</b>"},
  {d:"tip", q:"Déclencheur : « base de données sur le réseau interne »", a:"→ <b>Agent self-hosted.</b>"},
  {d:"tip", q:"Déclencheur : « le code tourne en production mais personne ne le voit »", a:"→ <b>Dark launching.</b>"},
  {d:"tip", q:"Déclencheur : « modifier un réglage sans redéployer ni redémarrer »", a:"→ <b>Azure App Configuration.</b>"},
  {d:"tip", q:"Déclencheur : « le template Bicep doit créer le groupe de ressources »", a:"→ Portée <b><code>subscription</code></b>."},
  {d:"tip", q:"Déclencheur : « le workflow doit accéder à un autre dépôt »", a:"→ <b>PAT.</b> <code>GITHUB_TOKEN</code> s'arrête au dépôt du workflow."},
  {d:"tip", q:"Déclencheur : « plusieurs ressources Azure partagent la même identité »", a:"→ <b>Managed identity user-assigned.</b>"},
  {d:"tip", q:"Déclencheur : « vérifier le site depuis plusieurs pays »", a:"→ <b>Availability tests</b> (Application Insights)."},
  {d:"tip", q:"Déclencheur : « sans aucun secret »", a:"→ <b>OIDC / workload identity federation.</b>"},
  {d:"tip", q:"Déclencheur : « rien ne doit bouger pendant l'audit »", a:"→ Verrou <b>ReadOnly</b>."},
  {d:"tip", q:"Déclencheur : « ressources déjà existantes, non conformes »", a:"→ <b>Tâche de remédiation</b> (DeployIfNotExists ou Modify)."},
];
CARDS.forEach((c,i)=>c.id=i);

/* ---------- État ---------- */
let baseOrder = CARDS.map(c=>c.id);
let filter = "all";
let reviewOnly = false;
let pos = 0;
let flipped = false;
const status = {}; // id -> 'known' | 'review'

/* ---------- Persistance (localStorage, clé = texte de la question) ---------- */
const LS_KEY = "az400-progress-v1";
function saveStatus(){
  try{
    const m = {};
    for(const id in status){ m[CARDS[id].q] = status[id]; }
    localStorage.setItem(LS_KEY, JSON.stringify(m));
  }catch(e){ /* stockage indisponible : progression session uniquement */ }
}
function loadStatus(){
  try{
    const m = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
    CARDS.forEach(c => { if(m[c.q]) status[c.id] = m[c.q]; });
  }catch(e){}
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const card = $("#card");

function matches(id){
  const c = CARDS[id];
  if(filter!=="all" && c.d!==filter) return false;
  if(reviewOnly && status[id]!=="review") return false;
  return true;
}
function active(){ return baseOrder.filter(matches); }

function setAccent(domKey){
  const col = DOMAINS[domKey] ? DOMAINS[domKey].color : "var(--pip)";
  document.documentElement.style.setProperty("--accent", col);
  card.style.setProperty("--accent", col);
}

/* ---------- Rendu ---------- */
function renderFilters(){
  const box = $("#filters");
  box.innerHTML = "";
  const mk = (key,label,color) => {
    const el = document.createElement("div");
    el.className = "chip" + (filter===key ? " active":"");
    el.innerHTML = (color?`<span class="dot" style="background:${color}"></span>`:"") + label;
    el.onclick = () => { filter = key; pos = 0; flipped=false; render(); };
    return el;
  };
  box.appendChild(mk("all","Tout",""));
  Object.keys(DOMAINS).forEach(k=>box.appendChild(mk(k,DOMAINS[k].short,DOMAINS[k].color)));

  const rt = document.createElement("div");
  rt.className = "chip review-toggle" + (reviewOnly?" active":"");
  const rvCount = Object.values(status).filter(s=>s==="review").length;
  rt.innerHTML = "★ À revoir" + (rvCount?` (${rvCount})`:"");
  rt.onclick = () => { reviewOnly = !reviewOnly; pos = 0; flipped=false; render(); };
  box.appendChild(rt);
}

function render(){
  renderFilters();
  const list = active();
  const total = list.length;
  const knownN = Object.values(status).filter(s=>s==="known").length;
  const reviewN = Object.values(status).filter(s=>s==="review").length;

  // stats
  $("#stats").innerHTML =
    `<span class="k">carte ${total? (pos+1):0} / ${total}</span><br>`+
    `<span class="ok">su ${knownN}</span> · <span class="rv">à revoir ${reviewN}</span>`;

  const hasCards = total>0;
  card.style.display = hasCards ? "" : "none";
  $("#nav").style.display = hasCards ? "" : "none";
  $("#actions").style.display = hasCards ? "" : "none";
  $("#empty").style.display = hasCards ? "none" : "";

  if(!hasCards){
    $("#empty").innerHTML = reviewOnly
      ? "<b>Aucune carte « à revoir ».</b><br>Marque des cartes avec « À revoir »,<br>ou désactive le filtre."
      : "<b>Aucune carte dans ce filtre.</b>";
    $("#railFill").style.width = "0%";
    return;
  }

  if(pos>=total) pos = total-1;
  if(pos<0) pos = 0;

  const id = list[pos];
  const c = CARDS[id];
  const dom = DOMAINS[c.d];
  setAccent(c.d);

  // flip state
  card.classList.toggle("flipped", flipped);
  $("#flip").textContent = flipped ? "Question" : "Retourner";

  // content
  const eyebrow = `${dom.short} <span class="num">· ${pos+1}/${total}</span>`;
  $("#feyebrow").innerHTML = eyebrow;
  $("#beyebrow").innerHTML = eyebrow;
  $("#qtext").innerHTML = c.q;
  $("#atext").innerHTML = c.a;

  // flags
  const st = status[id];
  const flagTxt = st==="known" ? "Su" : st==="review" ? "À revoir" : "";
  const flagCls = "flag" + (st?` ${st}`:"");
  ["#fflag","#bflag"].forEach(sel=>{
    const el = $(sel);
    el.textContent = flagTxt;
    el.className = flagCls;
    el.style.display = st ? "" : "none";
  });

  // rail
  $("#railFill").style.width = ((pos+1)/total*100) + "%";
}

/* ---------- Actions ---------- */
function flip(){ flipped = !flipped; render(); }
function go(delta){
  const total = active().length; if(!total) return;
  pos = (pos + delta + total) % total;
  flipped = false; render();
}
function mark(state){
  const list = active(); if(!list.length) return;
  const id = list[pos];
  status[id] = (status[id]===state) ? undefined : state;
  if(status[id]===undefined) delete status[id];
  saveStatus();
  // avancer si on vient de trancher
  if(status[id]){ setTimeout(()=>go(1), 120); } else { render(); }
}
function shuffle(){
  for(let i=baseOrder.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [baseOrder[i],baseOrder[j]] = [baseOrder[j],baseOrder[i]];
  }
  pos = 0; flipped = false; render();
}
function reset(){
  for(const k in status) delete status[k];
  try{ localStorage.removeItem(LS_KEY); }catch(e){}
  reviewOnly = false; filter = "all"; pos = 0; flipped = false;
  baseOrder = CARDS.map(c=>c.id);
  render();
}

/* ---------- Écouteurs ---------- */
card.addEventListener("click", flip);
card.addEventListener("keydown", e=>{ if(e.key==="Enter"){e.preventDefault();flip();} });
$("#flip").addEventListener("click", e=>{ e.stopPropagation(); flip(); });
$("#prev").addEventListener("click", ()=>go(-1));
$("#next").addEventListener("click", ()=>go(1));
$("#markRev").addEventListener("click", ()=>mark("review"));
$("#markKnow").addEventListener("click", ()=>mark("known"));
$("#shuffle").addEventListener("click", shuffle);
$("#reset").addEventListener("click", reset);

document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  switch(e.key){
    case " ": e.preventDefault(); flip(); break;
    case "ArrowRight": go(1); break;
    case "ArrowLeft": go(-1); break;
    case "j": case "J": mark("known"); break;
    case "r": case "R": mark("review"); break;
    case "s": case "S": shuffle(); break;
  }
});

// swipe mobile
let tx=0, ty=0;
card.addEventListener("touchstart", e=>{ tx=e.changedTouches[0].clientX; ty=e.changedTouches[0].clientY; }, {passive:true});
card.addEventListener("touchend", e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){ go(dx<0?1:-1); }
}, {passive:true});

loadStatus();
render();
$("#foot").innerHTML = CARDS.length + " cartes · pièges d'examen & astuces inclus<br>Progression sauvegardée sur cet appareil.<br><a href=\"index.html\" style=\"color:var(--muted-2)\">À propos, code source & contributions</a>";
</script>
<script>
if("serviceWorker" in navigator){ addEventListener("load", ()=>navigator.serviceWorker.register("sw.js")); }
</script>
</body>
</html>
